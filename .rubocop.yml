AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "gemfiles/**/*"
    - "spec/dummy/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "citadel.gemspec"

Gemspec/RequireMFA:
  Enabled: false

Metrics/MethodLength:
  Max: 15

Naming/MemoizedInstanceVariableName:
  Enabled: false
