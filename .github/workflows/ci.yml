name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "4.0.3"
          bundler-cache: true

      - run: bundle exec rubocop lib spec Appraisals Rakefile Gemfile citadel.gemspec

  test:
    runs-on: ubuntu-latest
    needs: rubocop

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citadel_dummy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "4.0"]
        rails: ["rails-7-2", "rails-8-0"]

    env:
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CITADEL_RAILS_CONSTRAINT: ${{ matrix.rails == 'rails-7-2' && '~> 7.2.0' || '~> 8.0.0' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.3"
          bundler-cache: true
          cache-dependency-path: |
            Gemfile.lock
            gemfiles/*.gemfile.lock

      - name: Install appraisal gems
        run: bundle exec appraisal ${{ matrix.rails }} bundle install

      - name: Prepare dummy database
        run: |
          bundle exec appraisal ${{ matrix.rails }} bash -ec '
            cd spec/dummy
            bundle config set --local frozen false
            bundle lock --update rails
            bundle install
            bundle exec rails db:prepare
          '

      - name: Run RSpec
        run: bundle exec appraisal ${{ matrix.rails }} rspec
